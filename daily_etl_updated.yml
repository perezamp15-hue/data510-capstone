name: Daily Baseball Data Ingestion

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily MLB pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python scripts/run_daily_pipeline.py \
            --skip-players \
            --schedule-days-back 7 \
            --schedule-days-forward 14 \
            --pitch-days-back 7 \
            --pitch-limit 10
